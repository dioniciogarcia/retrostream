// RadialGamePad commit 08d1dd95 (https://github.com/Swordfish90/RadialGamePad, GPL v3), built from source
// with one Tirso Compiler fix: finger positions are read relative to the pad (MotionEvent.getX/getY)
// instead of from raw screen coordinates, which some phones (e.g. Galaxy S20 FE) report wrongly for a
// second finger, so two buttons pressed together didn't both register.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "com.swordfish.radialgamepad.library"
    compileSdk 35
    defaultConfig { minSdk 26 }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
