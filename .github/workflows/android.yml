name: Android APK
on:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[validation-only]') }}
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare pinned melonDS core
        run: bash tools/prepare_core.sh
      - name: Prepare all source-built console cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_runtime_cores.py
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tirsolador-preview-key-v2
      - name: Prepare existing application signing key
        env:
          TIRSO_SIGNING_KEY_B64: ${{ secrets.TIRSO_SIGNING_KEY_B64 }}
        run: bash tools/prepare_preview_key.sh
      - name: Build and lint
        env:
          TIRSO_TELEGRAM_API_HASH: ${{ secrets.TIRSO_TELEGRAM_API_HASH }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Package APK
        env:
          GH_TOKEN: ${{ github.token }}
          TIRSO_TELEGRAM_API_HASH: ${{ secrets.TIRSO_TELEGRAM_API_HASH }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tirsolador-v1.0.1.apk
          mkdir -p source
          git archive HEAD | tar -x -C source
          mkdir -p source/app/src/main/cpp/upstream
          git -C app/src/main/cpp/upstream archive HEAD | tar -x -C source/app/src/main/cpp/upstream
          gh release download native-1 --repo Randy3m2/tirsolador --pattern core-sources.tar.gz --dir /tmp/tirso-native-sources
          tar -xzf /tmp/tirso-native-sources/core-sources.tar.gz -C source
          tar -czf dist/Tirsolador-v1.0.1-source.tar.gz -C source .
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          if [ -n "$TIRSO_TELEGRAM_API_HASH" ]; then
            printf 'Telegram credentials: supplied by CI secret. Account authorization still requires QR.\n' > dist/BUILD_STATUS.txt
          else
            printf 'Telegram credentials: configure API hash once on the device, or supply TIRSO_TELEGRAM_API_HASH in GitHub Actions secrets and rebuild.\n' > dist/BUILD_STATUS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tirsolador-v1.0.1
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
  smoke-test:
    if: ${{ !contains(github.event.head_commit.message, '[native-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native core and own diagnostic ROM
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          bash tools/prepare_core.sh
          python tools/make_test_rom.py app/src/androidTest/assets/diagnostic.nds
          python tools/make_console_fixtures.py app/src/androidTest/assets
      - name: Prepare console cores for real execution tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_runtime_cores.py x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash tools/test_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-v1
          path: screenshots/
  upgrade-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tirsolador-v1.0.1
          path: dist
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Obtain installed version for update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --pattern '*.apk' --dir old
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: bash tools/test_upgrade.sh
  publish:
    needs: [build, upgrade-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tirsolador-v1.0.1
          path: dist
      - name: Publish verified APK and corresponding sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.1 dist/* --title 'Tirsolador 1.0.1 · N64 y guardados' --notes-file docs/BUILD_1_0_1.md
