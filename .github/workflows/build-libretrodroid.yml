name: Build LibretroDroid (phone)
# Builds Tirso's LibretroDroid native library (tools/libretrodroid) for the phone app; the result is committed
# to app/src/phone/jniLibs by hand after checking it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/libretrodroid/**', '.github/workflows/build-libretrodroid.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK and CMake
        run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Build liblibretrodroid.so (arm64-v8a)
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865
          CM=$ANDROID_SDK_ROOT/cmake/3.31.6/bin
          $CM/cmake -S tools/libretrodroid/src/main/cpp -B build -G Ninja -DCMAKE_MAKE_PROGRAM=$CM/ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          $CM/ninja -C build libretrodroid
          mkdir -p out && cp build/liblibretrodroid.so out/
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/liblibretrodroid.so
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: liblibretrodroid-arm64
          path: out/liblibretrodroid.so
