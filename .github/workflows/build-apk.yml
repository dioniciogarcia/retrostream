name: Build APK (fork)
# Simple build for this fork: no friend-owned signing key, no old-release upgrade test.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare pinned melonDS core
        run: bash tools/prepare_core.sh
      - name: Prepare all source-built console cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_runtime_cores.py
      - name: Restore signing key (own key, kept between builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: retrostream-signing-key-v1
      - name: Prepare signing key
        env:
          TIRSO_ALLOW_EPHEMERAL_KEY: '1'
        run: bash tools/prepare_preview_key.sh
      - name: Build release APK
        env:
          TIRSO_TELEGRAM_API_HASH: ${{ secrets.TIRSO_TELEGRAM_API_HASH }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Retrostream.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Retrostream-APK
          path: dist/*
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "Retrostream (latest build)" --notes "Automatic build of the latest commit. Download Retrostream.apk."
