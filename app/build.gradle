plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.tirso.tirsolador'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tirso.retrostream'
        minSdk 26
        targetSdk 35
        def tirsoBuild = providers.gradleProperty('tirsoBuild').orElse('0').get().toInteger()
        versionCode tirsoBuild > 0 ? tirsoBuild : 6
        versionName tirsoBuild > 0 ? "1.0.1.${tirsoBuild}" : '1.0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }   // same two CPU types as Tirso Compiler's TV games
        buildConfigField 'int', 'TELEGRAM_API_ID', '38798734'
        def telegramHash = providers.environmentVariable('TIRSO_TELEGRAM_API_HASH').orElse('').get()
        buildConfigField 'String', 'TELEGRAM_API_HASH', groovy.json.JsonOutput.toJson(telegramHash)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
    buildFeatures { buildConfig true }
    signingConfigs { debug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore') } }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false; debuggable false } }
    kotlinOptions { jvmTarget = '17' }
    ndkVersion '27.2.12479018'   // lets the build strip debug data from the native libraries
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    // The same player Tirso Compiler puts in its games: LibretroDroid 0.14.0 + RadialGamePad (built from source).
    implementation 'com.github.swordfish90:libretrodroid:0.14.0'
    implementation project(':radialgamepad')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'io.github.tdlib-android:core:0.1.1'
    implementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
