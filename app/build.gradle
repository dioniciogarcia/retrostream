plugins { id 'com.android.application' }
android {
    namespace 'com.tirso.tirsolador'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tirso.tirsolador.preview'
        minSdk 26
        targetSdk 35
        def tirsoBuild = providers.gradleProperty('tirsoBuild').orElse('0').get().toInteger()
        versionCode tirsoBuild > 0 ? tirsoBuild : 6
        versionName tirsoBuild > 0 ? "1.0.1.${tirsoBuild}" : '1.0.1'
        ndk { abiFilters(*providers.gradleProperty('tirsoAbis').orElse('armeabi-v7a,arm64-v8a,x86,x86_64').get().split(',')) }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release'; cppFlags '-O2' } }
        buildConfigField 'int', 'TELEGRAM_API_ID', '38798734'
        def telegramHash = providers.environmentVariable('TIRSO_TELEGRAM_API_HASH').orElse('').get()
        buildConfigField 'String', 'TELEGRAM_API_HASH', groovy.json.JsonOutput.toJson(telegramHash)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
    buildFeatures { buildConfig true }
    signingConfigs { debug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore') } }
    buildTypes { debug { externalNativeBuild { cmake { arguments '-DTIRSO_DIAGNOSTICS=ON' } } }; release { externalNativeBuild { cmake { arguments '-DTIRSO_DIAGNOSTICS=OFF' } }; signingConfig signingConfigs.debug; minifyEnabled false; debuggable false } }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'io.github.tdlib-android:core:0.1.1'
    implementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
